name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # غیرفعال کردن خروجی rich در CLI Flet برای جلوگیری از خرابی JSON به دلیل فرمت‌بندی/رنگ
      FLET_CLI_NO_RICH_OUTPUT: 1
      # اطمینان از رمزگذاری UTF-8
      PYTHONUTF8: 1

    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lifelog-apk
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error