name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # غیرفعال کردن خروجی rich در CLI Flet برای جلوگیری از خرابی JSON
      FLET_CLI_NO_RICH_OUTPUT: 1
      # اطمینان از رمزگذاری UTF-8 در تمام سطوح
      PYTHONUTF8: 1
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install 'flet[all]==1.1.2'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build APK
        env:
          # غیرفعال کردن خروجی rich برای جلوگیری از خطای رمزگذاری
          FLET_CLI_NO_RICH_OUTPUT: 1
          # غیرفعال کردن نوار پیشرفت uv
          UV_NO_PROGRESS: 1
          # اجبار پایتون به استفاده از UTF-8
          PYTHONUTF8: 1
          # این متغیر کلیدی: به flet می‌گوید بدون پرسیدن سوال، Flutter SDK را نصب کند
          FLET_CLI_SKIP_FLUTTER_SETUP: 0
        run: |
          # با استفاده از yes، به سوال "Proceed? [y/n]" به طور خودکار پاسخ y داده می‌شود
          yes | flet build apk --no-rich-output

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lifelog-apk
          path: build/apk/*.apk
          if-no-files-found: error